<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nihonkecee.dd: belajar bahasa Jepang</title>
<meta name="description" content="Belajar bahasa Jepang bertahap: kotoba, bunpou, kanji, dan latihan soal.">
<link rel="icon" href="logo.png">
<style>
:root{--navy:#0f3470;--navy2:#0a2552;--red:#d6322a;--yellow:#f6b820;--bg:#eef3fa;--ink:#0d1b3a;--muted:#4a5878;--line:#d3dff1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--navy)}
.brand img{border-radius:50%;display:block}
.bar a{font-size:14px;font-weight:700;color:#fff;background:var(--navy);padding:7px 14px;border-radius:999px;text-decoration:none}
main{padding:16px 0 32px;display:grid;gap:16px}
.mission{background:var(--navy);color:#fff;border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr 92px;gap:14px;align-items:center}
.mission h1{margin:0 0 4px;font-size:21px;line-height:1.2}
.mission p{margin:0 0 12px;color:#c5d3ee;font-size:14px}
.mission img{width:92px;height:92px;border-radius:14px;object-fit:cover;object-position:50% 25%}
.bartrack{height:10px;background:#2a4d8c;border-radius:6px;overflow:hidden}
.bartrack i{display:block;height:100%;width:0;background:var(--yellow);border-radius:6px;transition:width .3s}
.mnote{font-size:13px;color:#c5d3ee;margin-top:6px}
.btn{background:var(--yellow);color:#1a1205;font-weight:800;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
.mission .btn{grid-column:1/-1;margin-top:2px}
.chips{display:flex;gap:8px}
.chip{flex:1;padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
h2{font-size:17px;margin:4px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:26px;font-weight:900;color:var(--navy);background:#e3edfb}
.c2 .ico{background:#fdf0c4}.c3 .ico{background:#fde4e2;color:var(--red)}.c4 .ico{background:#dbe6f7}.c5 .ico,.c6 .ico{background:#eceff5;color:#6b7694}
.card b{font-size:16px}
.card span.d{font-size:13px;color:var(--muted)}
.badge{justify-self:start;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eef1f7;color:var(--muted)}
.card.go{border:2px solid var(--navy)}
.card.go .badge{background:var(--navy);color:#fff}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.q{font-size:22px;font-weight:800;margin:6px 0 14px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;text-align:left;cursor:pointer;font-size:17px}
.opt.ok{background:#e1f4e8;border-color:#2e9a5b}
.opt.no{background:#fde4e2;border-color:var(--red)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;margin-top:14px}
.ghost{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
form{display:grid;gap:10px}
label{font-weight:700}
input[type=email]{width:100%;padding:14px;font-size:16px;border-radius:10px;border:1.5px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:0}
.hide{position:absolute;left:-9999px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:90%;text-align:center}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 32px}
footer a{color:var(--navy);font-weight:700}
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <div class="brand"><img src="logo.png" alt="" width="34" height="34"><span>nihonkecee.dd</span></div>
    <a href="#daftar">Daftar tunggu</a>
  </div>
</header>

<main class="wrap">

  <section class="mission" aria-label="Misi harian">
    <div>
      <h1>Misi hari ini</h1>
      <p>Jawab 5 soal, jaga kebiasaan belajar lo.</p>
      <div class="bartrack"><i id="bar"></i></div>
      <div class="mnote" id="mnote">0 dari 5 soal</div>
    </div>
    <img src="hero.webp" alt="" width="92" height="92">
    <button class="btn" id="start">Mulai latihan</button>
  </section>

  <div id="home" style="display:grid;gap:16px">
    <div>
      <h2>Pilih level</h2>
      <div class="chips" style="margin-top:8px">
        <button class="chip" data-lv="dasar" aria-pressed="true">Dasar</button>
        <button class="chip" data-lv="menengah" aria-pressed="false">Menengah</button>
        <button class="chip" data-lv="lanjut" aria-pressed="false">Lanjut</button>
      </div>
    </div>

    <div>
      <h2>Materi</h2>
      <div class="grid" style="margin-top:8px">
        <button class="card c1" data-soon="Kotoba"><span class="ico" aria-hidden="true">語</span><b>Kotoba</b><span class="d">Kosakata per situasi</span><span class="badge">Segera hadir</span></button>
        <button class="card c2" data-soon="Bunpou"><span class="ico" aria-hidden="true">文</span><b>Bunpou</b><span class="d">Pola tata bahasa</span><span class="badge">Segera hadir</span></button>
        <button class="card c3" data-soon="Kanji"><span class="ico" aria-hidden="true">字</span><b>Kanji</b><span class="d">Bentuk, arti, cara baca</span><span class="badge">Segera hadir</span></button>
        <button class="card c4 go" id="cardquiz"><span class="ico" aria-hidden="true">試</span><b>Latihan soal</b><span class="d">Kuis pilihan ganda</span><span class="badge">Bisa dicoba</span></button>
      </div>
    </div>

    <div>
      <h2>Berikutnya</h2>
      <div class="grid" style="margin-top:8px">
        <button class="card c5" data-soon="Persiapan SSW"><span class="ico" aria-hidden="true">働</span><b>Persiapan SSW</b><span class="d">Bahasa untuk kerja di Jepang</span><span class="badge">Segera hadir</span></button>
        <button class="card c6" data-soon="Ujian Tokutei Ginou 2"><span class="ico" aria-hidden="true">技</span><b>Ujian Tokutei Ginou 2</b><span class="d">Latihan soal ujian</span><span class="badge">Segera hadir</span></button>
      </div>
    </div>
  </div>

  <section class="box" id="quiz" hidden></section>

  <section class="box" id="daftar">
    <h2 style="margin:0 0 6px">Jadi yang pertama tahu</h2>
    <p class="note" style="margin-bottom:12px">Taruh email lo. Kami kabari sekali pas materi lengkapnya dibuka.</p>
    <form name="waitlist" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="waitlist">
      <p class="hide"><label>Jangan diisi: <input name="bot-field"></label></p>
      <label for="email">Alamat email</label>
      <input id="email" type="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
      <button class="btn" type="submit">Masuk daftar tunggu</button>
    </form>
  </section>

</main>

<footer>nihonkecee.dd, lagi dibangun. Ikuti di Instagram <a href="https://www.instagram.com/nihonkecee.dd">@nihonkecee.dd</a></footer>
<div id="toast" role="status" hidden></div>

<script>
var GOAL=5, level="dasar", cur=[], idx=0, score=0;
var Q={
dasar:[
["ありがとう artinya?",["Terima kasih","Maaf","Selamat pagi","Sampai jumpa"]],
["みず artinya?",["Air","Api","Pohon","Gunung"]],
["さん artinya angka?",["3","1","2","4"]],
["おはよう dipakai kapan?",["Pagi hari","Siang hari","Malam hari","Mau tidur"]],
["ねこ artinya?",["Kucing","Anjing","Burung","Ikan"]]],
menengah:[
["食べる artinya?",["Makan","Minum","Tidur","Lari"]],
["学校 dibaca?",["がっこう","がくこう","がっこお","がくこお"]],
["電車 artinya?",["Kereta listrik","Mobil","Sepeda","Pesawat"]],
["Bentuk lampau dari 行きます?",["行きました","行きません","行って","行く"]],
["私は毎日 ___ を飲みます。",["お茶","本","駅","車"]]],
lanjut:[
["Bentuk hormat (sonkeigo) dari 食べる?",["召し上がる","いただく","食べます","食う"]],
["〜ざるを得ない artinya?",["Terpaksa harus","Tidak mungkin","Boleh saja","Mungkin"]],
["締め切り dibaca?",["しめきり","しまきり","ていきり","しめぎり"]],
["経験 artinya?",["Pengalaman","Percobaan","Pengetahuan","Kebiasaan"]],
["いらっしゃる adalah bentuk hormat dari?",["Pergi / datang / ada","Makan","Melihat","Memberi"]]]
};
var $=function(s){return document.querySelector(s)};
function today(){return new Date().toLocaleDateString("sv")}
function load(){try{var d=JSON.parse(localStorage.getItem("nk")||"{}");return d.day===today()?d:{day:today(),n:0}}catch(e){return{day:today(),n:0}}}
function save(d){try{localStorage.setItem("nk",JSON.stringify(d))}catch(e){}}
function mission(){var n=Math.min(load().n,GOAL);$("#bar").style.width=(n/GOAL*100)+"%";$("#mnote").textContent=n>=GOAL?"Misi hari ini selesai. Mantap!":n+" dari "+GOAL+" soal"}
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(window._t);window._t=setTimeout(function(){t.hidden=true},2400)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){
  cur=shuffle(Q[level]).map(function(q){return{q:q[0],o:shuffle(q[1].map(function(t,i){return{t:t,ok:i===0}}))}});
  idx=0;score=0;$("#home").hidden=true;$("#quiz").hidden=false;show();
  $("#quiz").scrollIntoView({block:"start"});
}
function show(){
  var c=cur[idx],h='<div class="meta"><span>Soal '+(idx+1)+' dari '+cur.length+'</span><span>Level '+level+'</span></div><p class="q">'+c.q+'</p><div class="opts">';
  c.o.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'">'+o.t+'</button>'});
  h+='</div><div class="row"><button class="ghost" id="back">Keluar</button><button class="btn" id="next" hidden>Lanjut</button></div>';
  $("#quiz").innerHTML=h;
}
function finish(){
  $("#quiz").innerHTML='<p class="q">Skor lo: '+score+' dari '+cur.length+'</p><p class="note">'+(score>=4?"Keren, lanjut ke level berikutnya kalau mau.":"Ulangi lagi, soalnya diacak ulang.")+'</p><div class="row"><button class="ghost" id="back">Kembali</button><button class="btn" id="again">Ulangi</button></div>';
}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.lv){level=t.dataset.lv;document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",c===t)});return}
  if(t.dataset.soon){toast(t.dataset.soon+" segera hadir. Daftar tunggu dulu ya.");return}
  if(t.id==="start"||t.id==="cardquiz"||t.id==="again"){start();return}
  if(t.id==="back"){$("#quiz").hidden=true;$("#home").hidden=false;return}
  if(t.id==="next"){idx++;idx<cur.length?show():finish();return}
  if(t.classList.contains("opt")){
    var o=cur[idx].o,ok=o[+t.dataset.i].ok;if(ok)score++;
    document.querySelectorAll(".opt").forEach(function(b,i){b.disabled=true;if(o[i].ok)b.classList.add("ok");else if(b===t)b.classList.add("no")});
    var d=load();d.n++;save(d);mission();
    var nx=$("#next");nx.hidden=false;nx.textContent=idx+1<cur.length?"Lanjut":"Lihat skor";
  }
});
mission();
</script>
</body>
</html>
